services:
  - type: web
    name: ktv-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: CORS_ORIGINS
        value: https://ktv-frontend-xi.vercel.app
      - key: YOUTUBE_API_KEY
        sync: false
